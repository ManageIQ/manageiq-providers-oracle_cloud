---
:ems:
  :ems_oracle_cloud:
    :additional_regions: {}
    :blacklisted_event_names:
    - com.oraclecloud.resourcequeryservice.searchresources
    - com.oraclecloud.identitysignon.federatedinteractiveloginattempt
    - serviceapi
    :disabled_regions: []
    :event_handling:
      :event_groups:
  :ems_oke:
    # High-frequency or routine lifecycle events filtered to reduce queue churn.
    :blacklisted_event_names:
    - CRONJOB_SCALINGREPLICASET
    - DAEMONSET_SCALINGREPLICASET
    - DEPLOYMENT_SCALINGREPLICASET
    - JOB_COMPLETED
    - JOB_SCALINGREPLICASET
    - NODE_NODEHASNODISKPRESSURE
    - NODE_NODEHASSUFFICIENTMEMORY
    - NODE_NODEHASSUFFICIENTPID
    - NODE_STARTING
    - PERSISTENTVOLUMECLAIM_PROVISIONINGSUCCEEDED
    - PERSISTENTVOLUMECLAIM_UNRECOGNIZEDDATASOURCEKIND
    - POD_ADDEDINTERFACE
    - POD_PULLED
    - POD_PULLING
    - POD_SUCCESSFULATTACHVOLUME
    - POD_SUCCESSFULDETACHVOLUME
    - POD_SUCCESSFULMOUNTVOLUME
    - POD_SUCCESSFULUNMOUNTVOLUME
    - REPLICASET_SCALINGREPLICASET
    - REPLICATOR_SCALINGREPLICASET
    - STATEFULSET_SCALINGREPLICASET
    
:ems_refresh:
  :oracle_cloud:
    :refresh_interval: 15.minutes
    :retry_config:
      :base_sleep_time: 1.second
      :exponential_growth_factor: 2
      :max_attempts: 5
      :max_elapsed_time: 5.minutes
      :max_sleep_between_attempts: 10.seconds
  :oke:
    :streaming_refresh: true
    :chunk_size: 1_000
    :inventory_collections:
      :saver_strategy: batch
:http_proxy:
  :oracle_cloud:
    :host:
    :password:
    :port:
    :user:
:log:
  :level_oracle: info
:workers:
  :worker_base:
    :event_catcher:
      :event_catcher_oracle_cloud:
        :poll: 20.seconds
      :event_catcher_oracle_oke:
        :poll: 20.seconds
    :queue_worker_base:
      :ems_metrics_collector_worker:
        :ems_metrics_collector_worker_oracle_cloud: {}
      :ems_refresh_worker:
        :ems_refresh_worker_oracle_cloud: {}
        :ems_refresh_worker_oracle_oke: {}
